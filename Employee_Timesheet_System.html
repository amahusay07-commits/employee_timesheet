<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Timesheet System</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0f1f3d;--blue:#1a56a0;--blue-lt:#e8f0fb;
  --green:#1a7f4b;--green-bg:#e6f4ed;
  --red:#c8102e;--red-bg:#fde8eb;
  --amber:#b07800;--amber-bg:#fff8e1;
  --gray:#f4f6f9;--border:#d0d8e8;
  --muted:#5a6a85;--text:#1a2236;--white:#fff;
  --radius:8px;--shadow:0 2px 12px rgba(15,31,61,.08);
  font-family:'IBM Plex Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#eef1f7;color:var(--text);min-height:100vh;font-size:14px;}

/* AUTH */
#authScreen{position:fixed;inset:0;background:#0a1628;display:flex;align-items:center;justify-content:center;z-index:999;}
.auth-box{background:#fff;border-radius:14px;padding:40px 36px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.auth-logo{width:52px;height:52px;background:var(--navy);border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:1.4rem;}
.auth-box h2{font-size:1.1rem;font-weight:600;color:var(--navy);margin-bottom:4px;}
.auth-box p{font-size:.8rem;color:var(--muted);margin-bottom:24px;}
.field-label{font-size:.72rem;font-weight:600;color:var(--navy);text-align:left;display:block;margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase;}
.field-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:.9rem;font-family:inherit;outline:none;margin-bottom:12px;transition:border-color .2s;}
.field-input:focus{border-color:var(--blue);}
.auth-btn{width:100%;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:6px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s;}
.auth-btn:hover{background:var(--blue);}
.auth-error{color:var(--red);font-size:.78rem;min-height:18px;margin-bottom:8px;text-align:left;font-weight:500;}

/* LAYOUT */
#appScreen{display:none;}
.app-header{background:var(--navy);color:#fff;padding:0;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,.25);}
.header-inner{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.header-title{font-size:1rem;font-weight:600;letter-spacing:.01em;}
.header-sub{font-size:.73rem;color:#a0b4d0;margin-top:1px;font-family:'IBM Plex Mono',monospace;}
.header-right{display:flex;align-items:center;gap:10px;}
.nav-tabs{background:#162848;display:flex;max-width:1200px;margin:0 auto;padding:0 24px;border-top:1px solid rgba(255,255,255,.07);}
.nav-tab{background:none;border:none;color:#7a9bc4;font-size:.8rem;font-weight:500;padding:10px 18px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;transition:color .15s,border-color .15s;}
.nav-tab:hover{color:#fff;}
.nav-tab.active{color:#f0a500;border-bottom-color:#f0a500;}
.main{max-width:1200px;margin:0 auto;padding:24px;}
.panel{display:none;}
.panel.active{display:block;}

/* CARDS */
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:16px;}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.card-title{font-size:.9rem;font-weight:600;color:var(--navy);}
.card-body{padding:18px;}

/* STATS ROW */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
.stat-box{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:14px 16px;}
.stat-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
.stat-val{font-size:1.5rem;font-weight:600;color:var(--navy);font-family:'IBM Plex Mono',monospace;line-height:1;}
.stat-val.green{color:var(--green);}
.stat-val.amber{color:var(--amber);}
.stat-val.red{color:var(--red);}

/* TIMESHEET TABLE */
.ts-wrap{overflow-x:auto;}
table.ts{width:100%;border-collapse:collapse;min-width:900px;font-size:.82rem;}
table.ts th{background:#f8fafc;padding:9px 10px;text-align:center;font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;border-bottom:1.5px solid var(--border);white-space:nowrap;}
table.ts th.left{text-align:left;}
table.ts td{padding:8px 10px;border-bottom:1px solid #f0f4f8;vertical-align:middle;}
table.ts td.task-name{color:var(--blue);font-weight:500;min-width:220px;}
table.ts td.project{color:var(--muted);white-space:nowrap;}
table.ts td.hours{text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:500;}
table.ts td.hours input{width:44px;padding:4px 6px;border:1.5px solid var(--border);border-radius:4px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.82rem;outline:none;}
table.ts td.hours input:focus{border-color:var(--blue);}
table.ts td.hours.filled{color:var(--navy);}
table.ts td.hours.empty{color:#ccc;}
table.ts tr.total-row td{background:#f8fafc;font-weight:600;border-top:2px solid var(--border);border-bottom:none;}
table.ts tr:hover:not(.total-row) td{background:#fafcfe;}

/* STATUS BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.03em;}
.badge.pending{background:#fff8e1;color:var(--amber);}
.badge.approved{background:var(--green-bg);color:var(--green);}
.badge.rejected{background:var(--red-bg);color:var(--red);}
.badge.submitted{background:var(--blue-lt);color:var(--blue);}
.badge.draft{background:#f4f6f9;color:var(--muted);}

/* BUTTONS */
.btn{font-family:inherit;font-size:.8rem;font-weight:600;padding:7px 16px;border-radius:6px;border:none;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--blue);}
.btn-success{background:var(--green);color:#fff;}
.btn-success:hover{background:#156039;}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger:hover{background:#a50d25;}
.btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--navy);background:var(--gray);}
.btn-amber{background:#fff8e1;color:var(--amber);border:1.5px solid #f0c040;}
.btn-amber:hover{background:#f0a500;color:#fff;border-color:#f0a500;}
.btn-sm{padding:5px 11px;font-size:.75rem;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
.form-group{display:flex;flex-direction:column;gap:4px;}
.form-label{font-size:.72rem;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;}
.form-control{padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-family:inherit;font-size:.85rem;outline:none;transition:border-color .2s;width:100%;}
.form-control:focus{border-color:var(--blue);}
select.form-control{background:#fff;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:12px;padding:28px 28px 22px;max-width:560px;width:95%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{font-size:1rem;font-weight:600;color:var(--navy);margin-bottom:16px;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:14px;border-top:1px solid var(--border);}

/* WEEK NAV */
.week-nav{display:flex;align-items:center;gap:8px;}
.week-nav .week-label{font-size:.82rem;font-weight:600;color:var(--navy);min-width:220px;text-align:center;font-family:'IBM Plex Mono',monospace;}
.btn-icon{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--navy);transition:all .15s;}
.btn-icon:hover{background:var(--gray);}

/* APPROVAL LIST */
.request-row{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.request-row:last-child{border-bottom:none;}
.request-info{flex:1;min-width:200px;}
.request-name{font-weight:600;font-size:.85rem;color:var(--navy);}
.request-detail{font-size:.75rem;color:var(--muted);margin-top:2px;}
.request-actions{display:flex;gap:6px;}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:8px;font-size:.83rem;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s ease;max-width:320px;}
.toast.show{transform:translateY(0);opacity:1;}

/* WEEK PERIOD BAR */
.period-bar{background:var(--blue-lt);border:1px solid #c0d8f5;border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:.82rem;color:var(--blue);display:flex;align-items:center;gap:8px;}

/* LOGOUT BTN */
.logout-btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 12px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.logout-btn:hover{background:rgba(255,255,255,.2);}

/* ADMIN EMPLOYEES */
.emp-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.75rem;flex-shrink:0;}

/* RESPONSIVE */
@media(max-width:600px){
  .form-grid,.form-grid.cols3{grid-template-columns:1fr;}
  .main{padding:14px;}
  .header-inner{padding:12px 16px;}
  .nav-tabs{padding:0 10px;}
}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">📋</div>
    <h2>Employee Timesheet System</h2>
    <p>Sign in with your credentials to continue</p>
    <label class="field-label">Username</label>
    <input class="field-input" id="authUser" type="text" placeholder="Enter username" autocomplete="off">
    <label class="field-label">Password</label>
    <input class="field-input" id="authPass" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" onclick="doLogin()">Sign In</button>
    <p style="margin-top:14px;font-size:.72rem;color:var(--muted);">Contact your administrator if you need access.</p>
  </div>
</div>

<!-- APP SCREEN -->
<div id="appScreen">
  <header class="app-header">
    <div class="header-inner">
      <div>
        <div class="header-title" id="headerTitle">Employee Timesheet System</div>
        <div class="header-sub" id="headerSub">Loading...</div>
      </div>
      <div class="header-right">
        <span id="welcomeSpan" style="color:#a0d4ff;font-size:.78rem;"></span>
        <button class="logout-btn" onclick="doLogout()">Sign Out</button>
      </div>
    </div>
    <div class="nav-tabs" id="navTabs"></div>
  </header>
  <div class="main" id="mainContent"></div>
</div>

<!-- MODALS -->
<div class="modal-bg" id="taskModal">
  <div class="modal">
    <h3 id="taskModalTitle">Submit Task Request</h3>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Task Name / Description</label>
        <input class="form-control" id="fTaskName" type="text" placeholder="e.g. FWDAir Core HR Integration">
      </div>
      <div class="form-group">
        <label class="form-label">Project Name</label>
        <input class="form-control" id="fProjectName" type="text" placeholder="e.g. FY26_HCM_Forward">
      </div>
      <div class="form-group">
        <label class="form-label">Time Type</label>
        <select class="form-control" id="fTimeType">
          <option>Actual</option>
          <option>Overtime</option>
          <option>Leave</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Week (Mon)</label>
        <input class="form-control" id="fWeekStart" type="date">
      </div>
    </div>
    <div style="margin-top:14px;padding:12px 14px;background:var(--gray);border-radius:6px;">
      <div style="font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Hours per day (leave blank for 0)</div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;" id="hoursInputs"></div>
    </div>
    <div id="taskModalError" style="color:var(--red);font-size:.78rem;min-height:16px;margin-top:8px;font-weight:500;"></div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal('taskModal')">Cancel</button>
      <button class="btn btn-primary" id="taskModalSubmit" onclick="submitTaskRequest()">Submit Request</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="timesheetModal">
  <div class="modal">
    <h3>Submit Timesheet for Approval</h3>
    <p id="timesheetModalMsg" style="font-size:.85rem;color:var(--muted);margin-bottom:16px;"></p>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal('timesheetModal')">Cancel</button>
      <button class="btn btn-success" onclick="confirmSubmitTimesheet()">Yes, Submit</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="rejectModal">
  <div class="modal">
    <h3>Reject Request</h3>
    <div class="form-group">
      <label class="form-label">Reason (optional)</label>
      <textarea class="form-control" id="rejectReason" rows="3" placeholder="Provide a reason for rejection..."></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="closeModal('rejectModal')">Cancel</button>
      <button class="btn btn-danger" onclick="confirmReject()">Reject</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
// DATA STORE
// ══════════════════════════════════════════════════════════
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];

const USERS = {
  'admin':                  {pass:'admin2025', role:'admin',    name:'Mahusay, Arey',            email:'arey.mahusay@accenture.com'},
  'donna.lyn.t.leonen':     {pass:'224906',    role:'employee', name:'Leonen, Donna Lyn T.',     email:'donna.lyn.t.leonen@accenture.com'},
  'nathaniel.vinluan':      {pass:'435003',    role:'employee', name:'Vinluan, Nathaniel',        email:'nathaniel.vinluan@accenture.com'},
  'allen.l.d.enriquez':     {pass:'626925',    role:'employee', name:'Enriquez, Allen L. D.',    email:'allen.l.d.enriquez@accenture.com'},
  'angel.ann.l.enriquez':   {pass:'636685',    role:'employee', name:'Enriquez, Angel Ann L.',   email:'angel.ann.l.enriquez@accenture.com'},
  'arey.mahusay':           {pass:'778636',    role:'employee', name:'Mahusay, Arey',             email:'arey.mahusay@accenture.com'},
  'ermina.m.lao':           {pass:'207622',    role:'employee', name:'Lao, Ermina M.',            email:'ermina.m.lao@accenture.com'},
};

// Persistent storage
function getStore(key, def){try{return JSON.parse(localStorage.getItem(key))||def;}catch{return def;}}
function setStore(key,val){localStorage.setItem(key,JSON.stringify(val));}

function getRequests(){return getStore('ts_requests',[]);}
function saveRequests(r){setStore('ts_requests',r);}
function getTimesheets(){return getStore('ts_timesheets',[]);}
function saveTimesheets(t){setStore('ts_timesheets',t);}

let currentUser = null;
let currentWeekOffset = 0;
let editingTaskId = null;
let rejectingId = null;
let submittingWeek = null;

// ══════════════════════════════════════════════════════════
// WEEK UTILITIES
// ══════════════════════════════════════════════════════════
function getWeekStart(offset){
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day===0?-6:1);
  d.setDate(diff + offset*7);
  d.setHours(0,0,0,0);
  return d;
}
function formatDate(d){
  return d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'});
}
function formatDateISO(d){
  return d.toISOString().split('T')[0];
}
function getWeekLabel(offset){
  const start = getWeekStart(offset);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return `${formatDate(start)} – ${formatDate(end)}`;
}
function getWeekDates(offset){
  const start = getWeekStart(offset);
  return DAY_KEYS.map((_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d;});
}
function weekKey(offset){
  return formatDateISO(getWeekStart(offset));
}
function weekKeyFromDate(dateStr){
  const d = new Date(dateStr);
  const day = d.getDay();
  const diff = d.getDate() - day + (day===0?-6:1);
  d.setDate(diff);
  d.setHours(0,0,0,0);
  return formatDateISO(d);
}

// ══════════════════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════════════════
function doLogin(){
  const u = document.getElementById('authUser').value.trim().toLowerCase();
  const p = document.getElementById('authPass').value;
  const errEl = document.getElementById('authError');
  if(!USERS[u] || USERS[u].pass !== p){
    errEl.textContent = 'Invalid username or password.';
    document.getElementById('authPass').value='';
    return;
  }
  currentUser = {...USERS[u], username: u};
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  initApp();
}
function doLogout(){
  currentUser=null;currentWeekOffset=0;
  document.getElementById('authScreen').style.display='flex';
  document.getElementById('appScreen').style.display='none';
  document.getElementById('authUser').value='';
  document.getElementById('authPass').value='';
  document.getElementById('authError').textContent='';
}

// ══════════════════════════════════════════════════════════
// APP INIT
// ══════════════════════════════════════════════════════════
function initApp(){
  document.getElementById('welcomeSpan').textContent = 'Welcome, '+currentUser.name.split(',')[1].trim()+'!';
  if(currentUser.role==='admin'){
    document.getElementById('headerTitle').textContent='Admin — Timesheet Manager';
    document.getElementById('headerSub').textContent='Approve requests & download reports';
    buildAdminNav();
    renderAdminDashboard();
  } else {
    document.getElementById('headerTitle').textContent='Employee Timesheet';
    document.getElementById('headerSub').textContent=currentUser.name+' · '+currentUser.email;
    buildEmployeeNav();
    renderEmployeeTimesheet();
  }
}

// ══════════════════════════════════════════════════════════
// EMPLOYEE NAV & VIEWS
// ══════════════════════════════════════════════════════════
function buildEmployeeNav(){
  document.getElementById('navTabs').innerHTML=`
    <button class="nav-tab active" onclick="switchTab(this,'empTimesheet')">My Timesheet</button>
    <button class="nav-tab" onclick="switchTab(this,'empRequests')">My Requests</button>
  `;
}

function renderEmployeeTimesheet(){
  const wk = weekKey(currentWeekOffset);
  const requests = getRequests().filter(r=>r.employeeUser===currentUser.username && r.status==='approved' && weekKeyFromDate(r.weekStart)===wk);
  const timesheets = getTimesheets();
  const submitted = timesheets.find(t=>t.employeeUser===currentUser.username && t.weekKey===wk);
  const dates = getWeekDates(currentWeekOffset);

  // Total hours per day
  const dayTotals = {};
  DAY_KEYS.forEach(d=>dayTotals[d]=0);
  requests.forEach(r=>{DAY_KEYS.forEach(d=>{dayTotals[d]+=(r.hours[d]||0);});});
  const totalHours = DAY_KEYS.reduce((s,d)=>s+dayTotals[d],0);

  let statusMsg='';
  if(submitted){
    if(submitted.status==='approved') statusMsg=`<span style="color:var(--green);font-weight:600;">&#10003; Your timesheet has been approved by ${submitted.approvedBy||'Admin'}.</span>`;
    else if(submitted.status==='submitted') statusMsg=`<span style="color:var(--amber);font-weight:600;">&#9654; Timesheet submitted — pending admin approval.</span>`;
  }

  let rowsHtml='';
  if(requests.length===0){
    rowsHtml=`<tr><td colspan="11" style="text-align:center;padding:28px;color:var(--muted);font-style:italic;">No approved tasks for this week. Submit a task request to get started.</td></tr>`;
  } else {
    requests.forEach(r=>{
      const dayCells = DAY_KEYS.map(d=>`<td class="hours ${r.hours[d]?'filled':'empty'}">${r.hours[d]||''}</td>`).join('');
      rowsHtml+=`<tr>
        <td class="task-name">${r.taskName}</td>
        <td class="project">${r.projectName}</td>
        <td style="text-align:center;">${r.timeType}</td>
        ${dayCells}
      </tr>`;
    });
    const totalCells = DAY_KEYS.map(d=>`<td class="hours" style="color:var(--navy);">${dayTotals[d]||''}</td>`).join('');
    rowsHtml+=`<tr class="total-row">
      <td colspan="2" style="text-align:right;color:var(--muted);">Total work</td>
      <td></td>
      ${totalCells}
    </tr>`;
  }

  const canSubmit = requests.length>0 && !submitted;

  document.getElementById('mainContent').innerHTML=`
    <div class="panel active" id="empTimesheet">
      <div class="stats-row">
        <div class="stat-box"><div class="stat-label">Total Hours This Week</div><div class="stat-val ${totalHours>0?'green':''}">${totalHours}h</div></div>
        <div class="stat-box"><div class="stat-label">Approved Tasks</div><div class="stat-val">${requests.length}</div></div>

function openTaskModal(editId){
  editingTaskId = editId||null;
  document.getElementById('taskModalTitle').textContent = editId?'Edit Task Request':'Submit Task Request';
  document.getElementById('taskModalSubmit').textContent = editId?'Update Request':'Submit Request';

  // Populate week dates inputs
  const wkStart = getWeekStart(currentWeekOffset);
  document.getElementById('fWeekStart').value = formatDateISO(wkStart);

  let hoursHtml='';
  DAYS.forEach((d,i)=>{
    hoursHtml+=`<div style="text-align:center;">
      <div style="font-size:.65rem;color:var(--muted);font-weight:600;margin-bottom:4px;">${d}</div>
      <input type="number" min="0" max="24" step="0.5" id="fHour_${DAY_KEYS[i]}" style="width:100%;padding:5px 4px;border:1.5px solid var(--border);border-radius:4px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.82rem;outline:none;" placeholder="0">
    </div>`;
  });
  document.getElementById('hoursInputs').innerHTML=hoursHtml;

  if(editId){
    const r = getRequests().find(r=>r.id===editId);
    if(r){
      document.getElementById('fTaskName').value=r.taskName;
      document.getElementById('fProjectName').value=r.projectName;
      document.getElementById('fTimeType').value=r.timeType;
      document.getElementById('fWeekStart').value=r.weekStart;
      DAY_KEYS.forEach(d=>{const el=document.getElementById('fHour_'+d);if(el)el.value=r.hours[d]||'';});
    }
  } else {
    document.getElementById('fTaskName').value='';
    document.getElementById('fProjectName').value='';
    document.getElementById('fTimeType').value='Actual';
  }
  document.getElementById('taskModalError').textContent='';
  document.getElementById('taskModal').classList.add('open');
}

function editRequest(id){openTaskModal(id);}

function submitTaskRequest(){
  const taskName = document.getElementById('fTaskName').value.trim();
  const projectName = document.getElementById('fProjectName').value.trim();
  const timeType = document.getElementById('fTimeType').value;
  const weekStart = document.getElementById('fWeekStart').value;
  const errEl = document.getElementById('taskModalError');

  if(!taskName){errEl.textContent='Task name is required.';return;}
  if(!projectName){errEl.textContent='Project name is required.';return;}
  if(!weekStart){errEl.textContent='Week start date is required.';return;}

  const hours={};
  DAY_KEYS.forEach(d=>{
    const v = parseFloat(document.getElementById('fHour_'+d).value)||0;
    hours[d]=v;
  });
  const totalH = DAY_KEYS.reduce((s,d)=>s+hours[d],0);
  if(totalH===0){errEl.textContent='Please enter hours for at least one day.';return;}

  const requests = getRequests();
  if(editingTaskId){
    const idx = requests.findIndex(r=>r.id===editingTaskId);
    if(idx>-1){requests[idx]={...requests[idx],taskName,projectName,timeType,weekStart,hours,status:'pending',updatedAt:new Date().toISOString()};}
    showToast('Task request updated!');
  } else {
    requests.push({id:'req_'+Date.now(),employeeUser:currentUser.username,employeeName:currentUser.name,taskName,projectName,timeType,weekStart,hours,status:'pending',createdAt:new Date().toISOString()});
    showToast('Task request submitted!');
  }
  saveRequests(requests);
  closeModal('taskModal');
  renderEmployeeTimesheet();
  syncTabs();
}

function deleteRequest(id){
  if(!confirm('Delete this task request?'))return;
  saveRequests(getRequests().filter(r=>r.id!==id));
  showToast('Request deleted.');
  renderEmployeeTimesheet();
  syncTabs();
}

function openTimesheetSubmit(){
  submittingWeek = weekKey(currentWeekOffset);
  document.getElementById('timesheetModalMsg').textContent=`Submit your timesheet for the week of ${getWeekLabel(currentWeekOffset)}? Once submitted, the admin will review and approve it.`;
  document.getElementById('timesheetModal').classList.add('open');
}
function confirmSubmitTimesheet(){
  const timesheets = getTimesheets();
  const existing = timesheets.findIndex(t=>t.employeeUser===currentUser.username&&t.weekKey===submittingWeek);
  const entry = {
    id:'ts_'+Date.now(),
    employeeUser:currentUser.username,
    employeeName:currentUser.name,
    weekKey:submittingWeek,
    weekLabel:getWeekLabel(currentWeekOffset),
    status:'submitted',
    submittedAt:new Date().toISOString(),
  };
  if(existing>-1)timesheets[existing]=entry;
  else timesheets.push(entry);
  saveTimesheets(timesheets);
  closeModal('timesheetModal');
  showToast('Timesheet submitted for approval!');
  renderEmployeeTimesheet();
  syncTabs();
}

  saveRequests(requests);

function approveAllPending(){
  const requests = getRequests();
  let count=0;
  requests.forEach(r=>{if(r.status==='pending'){r.status='approved';r.approvedAt=new Date().toISOString();r.approvedBy=currentUser.name;count++;}});
  saveRequests(requests);
  showToast(`${count} request(s) approved!`);

let rejectingType='req';
function openRejectModal(id,type='req'){
  rejectingId=id;rejectingType=type;
  document.getElementById('rejectReason').value='';
  document.getElementById('rejectModal').classList.add('open');
}
function confirmReject(){
  const reason=document.getElementById('rejectReason').value.trim();
  if(rejectingType==='ts'){
    const ts=getTimesheets();const idx=ts.findIndex(t=>t.id===rejectingId);
    if(idx>-1){ts[idx].status='rejected';ts[idx].rejectReason=reason;}
    saveTimesheets(ts);
  } else {
    const reqs=getRequests();const idx=reqs.findIndex(r=>r.id===rejectingId);
    if(idx>-1){reqs[idx].status='rejected';reqs[idx].rejectReason=reason;}
    saveRequests(reqs);
  }
  closeModal('rejectModal');showToast('Rejected.');renderAdminDashboard();
}

function approveTimesheet(id){
  const ts=getTimesheets();const idx=ts.findIndex(t=>t.id===id);
  if(idx>-1){ts[idx].status='approved';ts[idx].approvedAt=new Date().toISOString();ts[idx].approvedBy=currentUser.name;}
  saveTimesheets(ts);showToast('Timesheet approved!');renderAdminDashboard();
}

function downloadSingleTimesheet(empUser, wkKey){
  const emp = Object.entries(USERS).find(([u])=>u===empUser);
  const empName = emp?emp[1].name:empUser;
  const requests = getRequests().filter(r=>r.employeeUser===empUser&&r.status==='approved'&&weekKeyFromDate(r.weekStart)===wkKey);

  const wkStart = new Date(wkKey);
  const dates = DAY_KEYS.map((_,i)=>{const d=new Date(wkStart);d.setDate(wkStart.getDate()+i);return d;});
  const dayHeaders = dates.map((d,i)=>`"${DAYS[i]} ${d.getMonth()+1}/${d.getDate()}"`).join(',');

  let csv=`"Employee","Project Name","Task Name","Time Type",${dayHeaders},"Total"\n`;
  let dayTotals = DAY_KEYS.map(()=>0);
  requests.forEach(r=>{
    const row = [empName,r.projectName,r.taskName,r.timeType,...DAY_KEYS.map((d,i)=>{const h=r.hours[d]||0;dayTotals[i]+=h;return h;}),DAY_KEYS.reduce((s,d)=>s+(r.hours[d]||0),0)];
    csv+=row.map(v=>`"${v}"`).join(',')+'\n';
  });
  csv+=`"","","","Total work",${dayTotals.map(h=>`"${h}"`).join(',')},"${dayTotals.reduce((s,h)=>s+h,0)}"\n`;

  downloadCSV(csv, `timesheet_${empUser}_${wkKey}.csv`);
}

function downloadAllTimesheets(){
  const timesheets = getTimesheets();
  if(timesheets.length===0){showToast('No timesheets to download.');return;}

  let csv=`"Employee","Email","Week","Project Name","Task Name","Time Type","Mon","Tue","Wed","Thu","Fri","Sat","Sun","Total Hours","Timesheet Status"\n`;

  timesheets.forEach(t=>{
    const emp = Object.entries(USERS).find(([u])=>u===t.employeeUser);
    const empEmail = emp?emp[1].email:'';
    const requests = getRequests().filter(r=>r.employeeUser===t.employeeUser&&r.status==='approved'&&weekKeyFromDate(r.weekStart)===t.weekKey);
    if(requests.length===0){
      csv+=`"${t.employeeName}","${empEmail}","${t.weekLabel}","","(No approved tasks)","",0,0,0,0,0,0,0,0,"${t.status}"\n`;
    } else {
      requests.forEach(r=>{
        const row=[t.employeeName,empEmail,t.weekLabel,r.projectName,r.taskName,r.timeType,...DAY_KEYS.map(d=>r.hours[d]||0),DAY_KEYS.reduce((s,d)=>s+(r.hours[d]||0),0),t.status];
        csv+=row.map(v=>`"${v}"`).join(',')+'\n';
      });
    }
  });

  downloadCSV(csv, `all_timesheets_${new Date().toISOString().split('T')[0]}.csv`);
  showToast('Compiled timesheet downloaded!');
}

function downloadCSV(content, filename){
  const blob = new Blob([content],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

// ══════════════════════════════════════════════════════════
// TABS & MODALS
// ══════════════════════════════════════════════════════════
function switchTab(btn, panelId){
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const panel=document.getElementById(panelId);if(panel)panel.classList.add('active');
}
function switchTabByName(panelId){
  const tabs=document.querySelectorAll('.nav-tab');
  const panels=['adminDashboard','adminRequests','adminTimesheets','adminEmployees'];
  const idx=panels.indexOf(panelId);
  if(idx>-1&&tabs[idx])switchTab(tabs[idx],panelId);
}
function syncTabs(){
  const activeTab=document.querySelector('.nav-tab.active');
  if(activeTab)activeTab.click();
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));

// ══════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg,color){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=color||'var(--navy)';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

// Allow enter key on auth
document.getElementById('authUser').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('authPass').focus();});
</script>
