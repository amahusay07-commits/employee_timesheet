<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Timesheet System</title>

<style>
:root{--navy:#0f1f3d;--blue:#1a56a0;--blue-lt:#e8f0fb;--green:#1a7f4b;--green-bg:#e6f4ed;--red:#c8102e;--red-bg:#fde8eb;--amber:#8a6000;--amber-bg:#fff8e1;--gray:#f4f6f9;--border:#d0d8e8;--muted:#5a6a85;--text:#1a2236;--white:#fff;--radius:6px;font-family:'IBM Plex Sans',sans-serif;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#eef1f7;color:var(--text);min-height:100vh;font-size:13px;}
#authScreen{position:fixed;inset:0;background:#0d1b2e;display:flex;align-items:center;justify-content:center;z-index:999;overflow:hidden;}
#bgCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.auth-box{position:relative;z-index:1;}
.auth-box{background:#fff;border-radius:12px;padding:36px 32px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.auth-logo{width:50px;height:50px;background:var(--navy);border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.5rem;}
.auth-box h2{font-size:1rem;font-weight:600;color:var(--navy);margin-bottom:4px;}
.auth-sub{font-size:.75rem;color:var(--muted);margin-bottom:20px;}
.f-label{font-size:.68rem;font-weight:600;color:var(--navy);text-align:left;display:block;margin-bottom:4px;letter-spacing:.05em;text-transform:uppercase;}
.f-input{width:100%;padding:9px 11px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:.85rem;font-family:inherit;outline:none;margin-bottom:10px;transition:border-color .2s;}
.f-input:focus{border-color:var(--blue);}
.auth-btn{width:100%;padding:10px;background:var(--navy);color:#fff;border:none;border-radius:var(--radius);font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;}
.auth-btn:hover{background:var(--blue);}
.auth-err{color:var(--red);font-size:.75rem;min-height:16px;margin-bottom:6px;text-align:left;font-weight:500;}
#appScreen{display:none;height:100vh;flex-direction:column;}
#appScreen.show{display:flex;}
.ribbon{background:#fff;border-bottom:1px solid var(--border);padding:0;flex-shrink:0;}
.ribbon-inner{display:flex;align-items:stretch;padding:0 12px;}
.ribbon-group{display:flex;flex-direction:column;border-right:1px solid var(--border);padding:5px 10px 2px;}
.ribbon-group:last-child{border-right:none;}
.ribbon-group-label{font-size:.58rem;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em;margin-top:3px;}
.ribbon-btns{display:flex;gap:3px;align-items:center;}
.rb{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 9px;border-radius:4px;cursor:pointer;border:none;background:none;font-family:inherit;font-size:.68rem;font-weight:500;color:var(--navy);transition:background .15s;min-width:40px;}
.rb:hover{background:#f0f4fa;}
.rb:disabled{opacity:.4;cursor:not-allowed;}
.rb .ri{font-size:1.25rem;line-height:1;}
.body-layout{display:flex;flex:1;overflow:hidden;}
.sidebar{width:160px;background:#fff;border-right:1px solid var(--border);flex-shrink:0;overflow-y:auto;}
.sidebar-section{padding:12px 0 4px;}
.sid-label{font-size:.6rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 12px 5px;}
.sid-item{display:block;padding:7px 12px;font-size:.78rem;color:var(--text);cursor:pointer;border-left:3px solid transparent;transition:all .15s;}
.sid-item:hover{background:#f8fafc;color:var(--blue);}
.sid-item.active{background:#e8f0fb;color:var(--blue);border-left-color:var(--blue);font-weight:500;}
.main-area{flex:1;overflow:auto;}
.approval-bar{background:#f0f7ff;border-bottom:1px solid #c0d8f0;padding:8px 18px;font-size:.78rem;color:var(--navy);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.week-nav-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 16px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px;}
.wk-label{font-size:.78rem;font-weight:600;color:var(--navy);font-family:'IBM Plex Mono',monospace;}
.wn-btn{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:.8rem;color:var(--navy);display:flex;align-items:center;justify-content:center;}
.wn-btn:hover{background:var(--gray);}
.ts-container{padding:14px 16px;}
.ts-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff;}
table.ts{width:100%;border-collapse:collapse;min-width:780px;font-size:.77rem;}
table.ts th{background:#f0f4fa;padding:7px 8px;text-align:center;font-weight:600;color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);border-right:1px solid var(--border);white-space:nowrap;}
table.ts th:last-child{border-right:none;}
table.ts th.left{text-align:left;}
table.ts td{padding:6px 8px;border-bottom:1px solid #f0f4f8;border-right:1px solid #f0f4f8;vertical-align:middle;}
table.ts td:last-child{border-right:none;}
table.ts td.task-name{color:var(--blue);font-weight:500;min-width:190px;}
table.ts td.project{color:var(--muted);white-space:nowrap;}
table.ts td.ttype{text-align:center;white-space:nowrap;}
table.ts td.hrs{text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:500;min-width:58px;}
table.ts td.wknd{background:#f8f9fa;}
table.ts tr.total-row td{background:#f8fafc;font-weight:600;border-top:2px solid var(--border);border-bottom:none;}
table.ts tr:hover:not(.total-row) td{background:#fafcfe;}
table.ts input[type=checkbox]{width:13px;height:13px;cursor:pointer;}
.panel-area{padding:14px 16px;}
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;}
.card-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.card-title{font-size:.85rem;font-weight:600;color:var(--navy);}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:12px;}
.stat-box{background:#fff;border-radius:var(--radius);border:1px solid var(--border);padding:11px 13px;}
.stat-label{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.stat-val{font-size:1.35rem;font-weight:600;color:var(--navy);font-family:'IBM Plex Mono',monospace;line-height:1;}
.stat-val.green{color:var(--green);}
.stat-val.amber{color:var(--amber);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.67rem;font-weight:600;}
.badge.pending{background:var(--amber-bg);color:var(--amber);}
.badge.approved{background:var(--green-bg);color:var(--green);}
.badge.rejected{background:var(--red-bg);color:var(--red);}
.badge.sent{background:var(--blue-lt);color:var(--blue);}
.badge.draft{background:#f4f6f9;color:var(--muted);}
.btn{font-family:inherit;font-size:.73rem;font-weight:600;padding:5px 12px;border-radius:var(--radius);border:1.5px solid transparent;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);}
.btn-primary:hover{background:var(--blue);}
.btn-success{background:var(--green);color:#fff;border-color:var(--green);}
.btn-success:hover{background:#156039;}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red);}
.btn-danger:hover{background:#a00d25;}
.btn-outline{background:#fff;color:var(--navy);border-color:var(--border);}
.btn-outline:hover{border-color:var(--navy);}
.btn-sm{padding:4px 9px;font-size:.68rem;}
.req-row{padding:10px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.req-row:last-child{border-bottom:none;}
.req-info{flex:1;min-width:170px;}
.req-name{font-weight:600;font-size:.8rem;color:var(--navy);}
.req-detail{font-size:.7rem;color:var(--muted);margin-top:1px;}
.req-actions{display:flex;gap:4px;flex-shrink:0;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:10px;padding:22px 22px 16px;max-width:520px;width:95%;max-height:90vh;overflow-y:auto;box-shadow:0 16px 50px rgba(0,0,0,.3);}
.modal h3{font-size:.92rem;font-weight:600;color:var(--navy);margin-bottom:12px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.form-group{display:flex;flex-direction:column;gap:3px;}
.form-label{font-size:.65rem;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;}
.form-ctrl{padding:7px 9px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;font-size:.8rem;outline:none;transition:border-color .2s;width:100%;}
.form-ctrl:focus{border-color:var(--blue);}
select.form-ctrl{background:#fff;}
.modal-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:14px;padding-top:11px;border-top:1px solid var(--border);}
.modal-err{color:var(--red);font-size:.7rem;min-height:14px;margin-top:5px;font-weight:500;}

.toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:9px 15px;border-radius:6px;font-size:.78rem;font-weight:500;z-index:9999;transform:translateY(50px);opacity:0;transition:all .3s;max-width:260px;}
.toast.show{transform:translateY(0);opacity:1;}
.hdr-right{display:flex;align-items:center;gap:8px;padding:6px 16px;background:var(--navy);color:#fff;font-size:.72rem;flex-shrink:0;}
.logout-btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:4px 9px;font-size:.7rem;font-weight:600;cursor:pointer;font-family:inherit;}

.empty{padding:22px;text-align:center;color:var(--muted);font-style:italic;font-size:.8rem;}
@media(max-width:600px){.sidebar{display:none;}.form-grid{grid-template-columns:1fr;}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>

function addManualSyncButton(){

function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const script = document.createElement('script');
    let done = false;

    window[cb] = (data) => {
      done = true;
      try { delete window[cb]; } catch(e){}
      script.remove();
      resolve(data);
    };

    script.src = url + (url.includes('?') ? '&' : '?') + 'cb=' + cb;
    script.onerror = () => {
      try { delete window[cb]; } catch(e){}
      script.remove();
      reject(new Error('JSONP request failed'));
    };

    setTimeout(() => {
      if(!done){
        try { delete window[cb]; } catch(e){}
        script.remove();
        reject(new Error('JSONP request timed out'));
      }
    }, 20000);

    document.body.appendChild(script);
  });
}

    id: r.id || '',

    empName: r.empName || '',

function mapTimesheetToGs(t){
  return {
    id: t.id || '',

function applyRemoteData(payload, opts={}){
  const reqs = (payload.requests || []).map(mapRequestFromGs);
  const tls = (payload.timesheets || []).map(mapTimesheetFromGs);
  setR(reqs);
  setT(tls);
  LAST_SERVER_HASH = dataHash({requests:reqs, timesheets:tls});
  LAST_SYNC_AT = new Date();
  updateSyncStatus('Synced ' + LAST_SYNC_AT.toLocaleTimeString(), '#9fe3b5');

  if(opts.rerender && CU){
    if(CU.role==='admin') adminView(CV);
    else if(CV==='rq') renderMyReqs();
    else renderTS();
  }
}

async function loadFromGist(){
  IS_LOADING_REMOTE = true;
  updateSyncStatus('Loading...', '#ffd87a');
  try {
    const res = await jsonp(GAS_URL + '?action=getAllData');
    console.log('API RESPONSE:', res);
    if (!res || res.ok !== true) throw new Error(res?.error || 'Invalid response from server');
    applyRemoteData(res.data || {}, { rerender:false });
  } catch (e) {
    console.error('Load error:', e);
    updateSyncStatus('Offline mode', '#ffb3b3');
    alert('Failed to load data');
  } finally {
    IS_LOADING_REMOTE = false;
  }
}

async function saveToGist(actionLabel='sync'){
  if(IS_SAVING) return;
  IS_SAVING = true;
  updateSyncStatus('Saving...', '#ffd87a');
  try {
    const payload = {
      requests: getR().map(mapRequestToGs),
      timesheets: getT().map(mapTimesheetToGs),
      actorUsername: CU?.username || '',
      actorName: CU?.name || '',
      actorRole: CU?.role || '',
      source: 'github_pages',
      actionLabel
    };

    const res = await jsonp(
      GAS_URL + '?action=syncAll&data=' + encodeURIComponent(JSON.stringify(payload))
    );

    if (!res || res.ok !== true) throw new Error(res?.error || 'Save failed');
    LAST_SERVER_HASH = dataHash(syncSnapshot());
    LAST_SYNC_AT = new Date();
    updateSyncStatus('Saved ' + LAST_SYNC_AT.toLocaleTimeString(), '#9fe3b5');
  } catch (e) {
    console.error('SAVE ERROR:', e);
    updateSyncStatus('Save failed', '#ffb3b3');
    showToast('Save error: ' + e.message);
    throw e;
  } finally {
    IS_SAVING = false;
  }
}

async function persistR(reqs){
  setR(reqs);
  await saveToGist('requests_update');
}

async function persistT(tls){
  setT(tls);
  await saveToGist('timesheets_update');
}

async function checkForRemoteChanges(force=false){
  if(IS_SAVING || IS_LOADING_REMOTE || !CU) return;
  try {
    const res = await jsonp(GAS_URL + '?action=getAllData');
    if (!res || res.ok !== true) return;
    const remote = {
      requests: (res.data?.requests || []).map(mapRequestFromGs),
      timesheets: (res.data?.timesheets || []).map(mapTimesheetFromGs)
    };
    const remoteHash = dataHash(remote);
    const localHash = dataHash(syncSnapshot());
    if(force || (!LAST_SERVER_HASH || remoteHash !== LAST_SERVER_HASH)){
      if(remoteHash !== localHash || force){
        applyRemoteData(remote, { rerender:true });
        if(!force) showToast('Latest data synced from server');
      } else {
        LAST_SERVER_HASH = remoteHash;
        LAST_SYNC_AT = new Date();
        updateSyncStatus('Up to date ' + LAST_SYNC_AT.toLocaleTimeString(), '#9fe3b5');
      }
    }
  } catch(e) {
    console.warn('Background sync skipped:', e.message);
    updateSyncStatus('Connection issue', '#ffb3b3');
  }
}

function startAutoSync(){
  stopAutoSync();
  SYNC_TIMER = setInterval(() => checkForRemoteChanges(false), AUTO_SYNC_MS);
}
function stopAutoSync(){
  if(SYNC_TIMER) clearInterval(SYNC_TIMER);
  SYNC_TIMER = null;
}

function showLoader(){ updateSyncStatus('Working...', '#ffd87a'); }
function hideLoader(){
  if(LAST_SYNC_AT) updateSyncStatus('Synced ' + LAST_SYNC_AT.toLocaleTimeString(), '#9fe3b5');
  else updateSyncStatus('Ready', '#cfe5ff');
}


let CU=null,WO=0,RJID=null,RJTYPE='req',ED=null,CV='ts';
function getFri(o){
  const now = new Date();
  const day = now.getDay(); // 0=Sun, 1=Mon, ..., 5=Fri

  // Calculate difference to Friday
  let diff = 5 - day;
  if (diff > 0) diff -= 7; // go to previous Friday

  const d = new Date(now);
  d.setDate(now.getDate() + diff + (o * 7));
  d.setHours(0,0,0,0);

  return d;
}


function getDates(o){
  const f = getFri(o); // Friday
  return [
    new Date(f),                         // Fri
    new Date(f.getTime()+1*86400000),    // Sat
    new Date(f.getTime()+2*86400000),    // Sun
    new Date(f.getTime()+3*86400000),    // Mon
    new Date(f.getTime()+4*86400000),    // Tue
    new Date(f.getTime()+5*86400000),    // Wed
    new Date(f.getTime()+6*86400000)     // Thu
  ];
}
function wk(o){return iso(getFri(o));}
function iso(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function fm(d){return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();}
function fs(d){return (d.getMonth()+1)+'/'+d.getDate();}
function wkLabel(o){const ds=getDates(o);return fm(ds[0])+' 12:00 AM - '+fm(ds[6])+' 11:59 PM';}
function wkShort(o){const ds=getDates(o);return fs(ds[0])+' – '+fs(ds[6]);}

// ── DATA MIGRATION: normalize all wk keys to local Friday ───────────────────
function normalizeFriday(dateStr){
  // Normalize any date to the Sunday of its week
  if(!dateStr) return dateStr;
  const d = new Date(dateStr+'T12:00:00');
  const dy = d.getDay(); // 0=Sun
  d.setDate(d.getDate()-dy); // go back to Sunday
  return iso(d);
}
function migrateData(){
  // Fix request wk keys
  const reqs = getR();
  let changed = false;
  reqs.forEach(r=>{
    const norm = normalizeFriday(r.wk);
    if(norm && norm !== r.wk){ r.wk = norm; changed = true; }
  });
  if(changed){ setR(reqs); }

  // Fix timesheet wk keys AND remove ghost records (approved without sentAt)
  const tls = getT();
  let changed2 = false;
  const cleanTls = tls.filter(t=>{
    // Remove ghost approved timesheets that were never sent by employee
    if(t.status==='approved' && (!t.sentAt || t.sentAt==='')){
      changed2 = true;
      return false;
    }
    const norm = normalizeFriday(t.wk);
    if(norm && norm !== t.wk){ t.wk = norm; changed2 = true; }
    return true;
  });
  if(changed2){ setT(cleanTls); }
}

function updateHrs(inputEl){
  const reqId  = inputEl.getAttribute('data-id');
  const dayKey = inputEl.getAttribute('data-day');
  const val    = inputEl.value;
  const reqs = getR();
  const idx  = reqs.findIndex(r=>r.id===reqId);
  if(idx>-1){
    if(!reqs[idx].hrs) reqs[idx].hrs={};
    reqs[idx].hrs[dayKey] = parseFloat(val)||0;

// ── ANIMATED BACKGROUND ──────────────────────────────────────────────────────
(function(){
  const canvas = document.getElementById('bgCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, icons, particles, lines;

  // Icon definitions: emoji-based icons representing work/finance/tech
  const ICON_SET = [
    '💻','🖥️','⚙️','🔧','🖨️','📊','📈','💰','💳','🗂️',
    '📋','🔒','☁️','📡','🖱️','⌨️','📱','🏦','💵','🔑',
    '📂','🗄️','⚡','🔌','💡','📌','✅','🖇️','🗓️','📝'
  ];

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    init();
  }

  function init(){
    // Floating icons
    icons = Array.from({length: 28}, () => ({
      icon: ICON_SET[Math.floor(Math.random()*ICON_SET.length)],
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.35,
      vy: (Math.random()-0.5)*0.35,
      size: Math.random()*18+14,
      alpha: Math.random()*0.18+0.06,
      rot: Math.random()*Math.PI*2,
      vrot: (Math.random()-0.5)*0.008
    }));

    // Small dot particles
    particles = Array.from({length: 60}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.5,
      vy: (Math.random()-0.5)*0.5,
      r: Math.random()*1.8+0.5,
      alpha: Math.random()*0.35+0.1,
      color: Math.random()<0.5 ? '#4a9eff' : '#f0a500'
    }));

    // Grid nodes for circuit lines
    const COLS = Math.ceil(W/90)+1, ROWS = Math.ceil(H/90)+1;
    lines = [];
    for(let r=0; r<ROWS; r++){
      for(let c=0; c<COLS; c++){
        if(Math.random()<0.35){
          const dir = Math.random()<0.5 ? 'h' : 'v';
          lines.push({
            x: c*90, y: r*90,
            len: (Math.floor(Math.random()*3)+1)*90,
            dir,
            alpha: Math.random()*0.12+0.03,
            pulse: Math.random()*Math.PI*2,
            speed: Math.random()*0.02+0.005
          });
        }
      }
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // Background gradient
    const bg = ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,'#070e1c');
    bg.addColorStop(0.5,'#0d1b2e');
    bg.addColorStop(1,'#040a14');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    // Radial glow — blue bottom right
    const g1 = ctx.createRadialGradient(W,H,0,W*0.85,H*0.85,W*0.5);
    g1.addColorStop(0,'rgba(26,86,160,0.18)');
    g1.addColorStop(1,'rgba(26,86,160,0)');
    ctx.fillStyle=g1; ctx.fillRect(0,0,W,H);

    // Radial glow — amber top left
    const g2 = ctx.createRadialGradient(0,0,0,W*0.15,H*0.15,W*0.4);
    g2.addColorStop(0,'rgba(240,165,0,0.12)');
    g2.addColorStop(1,'rgba(240,165,0,0)');
    ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);

    // Circuit grid lines
    lines.forEach(l => {
      l.pulse += l.speed;
      const a = l.alpha * (0.6 + Math.sin(l.pulse)*0.4);
      ctx.beginPath();
      if(l.dir==='h'){ ctx.moveTo(l.x,l.y); ctx.lineTo(l.x+l.len,l.y); }
      else { ctx.moveTo(l.x,l.y); ctx.lineTo(l.x,l.y+l.len); }
      ctx.strokeStyle = `rgba(74,158,255,${a})`;
      ctx.lineWidth = 0.7;
      ctx.stroke();
      // node dot at junction
      ctx.beginPath();
      ctx.arc(l.x, l.y, 1.8, 0, Math.PI*2);
      ctx.fillStyle = `rgba(74,158,255,${a*1.5})`;
      ctx.fill();
    });

    // Particles
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if(p.x<0) p.x=W; if(p.x>W) p.x=0;
      if(p.y<0) p.y=H; if(p.y>H) p.y=0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = p.color.replace(')',`,${p.alpha})`).replace('rgb','rgba');
      const c = p.color==='#4a9eff'?'74,158,255':'240,165,0';
      ctx.fillStyle = `rgba(${c},${p.alpha})`;
      ctx.fill();
    });

    // Particle connections
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx=particles[i].x-particles[j].x, dy=particles[i].y-particles[j].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<100){
          ctx.beginPath();
          ctx.moveTo(particles[i].x,particles[i].y);
          ctx.lineTo(particles[j].x,particles[j].y);
          ctx.strokeStyle=`rgba(74,158,255,${(1-dist/100)*0.12})`;
          ctx.lineWidth=0.5;
          ctx.stroke();
        }
      }
    }

    // Floating icons
    icons.forEach(ic => {
      ic.x += ic.vx; ic.y += ic.vy; ic.rot += ic.vrot;
      if(ic.x < -40) ic.x = W+40;
      if(ic.x > W+40) ic.x = -40;
      if(ic.y < -40) ic.y = H+40;
      if(ic.y > H+40) ic.y = -40;
      ctx.save();
      ctx.translate(ic.x, ic.y);
      ctx.rotate(ic.rot);
      ctx.globalAlpha = ic.alpha;
      ctx.font = `${ic.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ic.icon, 0, 0);
      ctx.restore();
    });

    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener('resize', resize);
  draw();
})();






// ── ADMIN: Add task directly for an employee ─────────────────────
function openAdminAddTask(){
  // Build employee dropdown
  const empList = Object.entries(USERS).filter(([,u])=>u.role==='employee');
  const opts = empList.map(([un,ud])=>`<option value="${un}">${ud.name}</option>`).join('');

  // Create modal dynamically
  let modal = document.getElementById('adminAddTaskModal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'adminAddTaskModal';
    modal.className = 'modal-bg';
    document.body.appendChild(modal);
  }
  modal.innerHTML = `<div class="modal">
    <h3>Add Task for Employee</h3>
    <div class="form-grid">
      <div class="form-group" style="grid-column:span 2;">
        <label class="form-label">Employee</label>
        <select class="form-ctrl" id="aEmp">${opts}</select>
      </div>
      <div class="form-group" style="grid-column:span 2;">
        <label class="form-label">Task Name / Description</label>
        <input class="form-ctrl" id="aTask" type="text" placeholder="e.g. FWDAir_Core HR_Integration">
      </div>
      <div class="form-group">
        <label class="form-label">Project Name</label>
        <input class="form-ctrl" id="aProj" type="text" placeholder="e.g. FY26_HCM_Forward">
      </div>
      <div class="form-group">
        <label class="form-label">Time Type</label>
        <select class="form-ctrl" id="aTtype"><option>Actual</option><option>Overtime</option><option>Leave</option></select>
      </div>
	  <div class="form-group">
		<label class="form-label">Start Date</label>
		<input class="form-ctrl" id="aStartDate" type="date">
	  </div>
      <div class="form-group">
		<label class="form-label">End Date</label>
		<input class="form-ctrl" id="aEndDate" type="date">
	  </div>
    <div id="aErr" style="color:var(--red);font-size:.72rem;min-height:14px;margin-top:6px;"></div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="document.getElementById('adminAddTaskModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" onclick="adminSaveTask()">Add & Approve Task</button>
    </div>
  </div>`;
  modal.classList.add('open');
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.classList.remove('open'); });
}

function adminSaveTask(){
  const empUser = document.getElementById('aEmp').value;
  const task    = document.getElementById('aTask').value.trim();
  const proj    = document.getElementById('aProj').value.trim();
  const ttype   = document.getElementById('aTtype').value;
  const startDate = document.getElementById('aStartDate').value;
  const endDate = document.getElementById('aEndDate').value;
  const errEl   = document.getElementById('aErr');

  if(!task){ errEl.textContent='Task name required.'; return; }
  if(!proj){ errEl.textContent='Project name required.'; return; }
  if(!startDate){
  errEl.textContent = 'Start date required.';
  return;
  }
  if(!endDate){
  errEl.textContent = 'End date required.';
  return;
  }


  // Normalize to Friday
  const wkDate = new Date(wkv+'T12:00:00');
  const normWk = iso(wkDate);

  const empData = USERS[empUser];
  const reqs = getR();
  const newReq = {
    id: 'r'+Date.now(),
    emp: empUser,
    empName: empData ? empData.name : empUser,
    task, proj, ttype,
    wk: wkv,
    hrs: {sun:0,mon:0,tue:0,wed:0,thu:0,fri:0,sat:0},
    status: 'approved',
    approvedAt: new Date().toISOString(),
    approvedBy: CU.name,
    ca: new Date().toISOString()
  };
  reqs.push(newReq);
  persistR(reqs).then(()=>{
    document.getElementById('adminAddTaskModal').classList.remove('open');
    showToast('Task added & approved for '+newReq.empName+' ✅');
    adminView(CV);
  }).catch(()=>{});
}

function adminDelReq(id){
  if(!confirm('Delete this task request?')) return;
  persistR(getR().filter(r=>r.id!==id)).then(()=>{
  showToast('Deleted.');
  adminView(CV);
}).catch(()=>{});
}


// ── ADD ROW: copy existing approved task to a new week ────────────
function openAddRow(){
  // Get all unique approved tasks for this employee (from any week)
  const allReqs = getR().filter(r => r.emp === CU.username && r.status === 'approved');
  if(allReqs.length === 0){
    showToast('No approved tasks yet. Ask your admin to add tasks first.');
    return;
  }

  // Deduplicate by task+proj+ttype
  const seen = new Set();
  const unique = [];
  allReqs.forEach(r => {
    const key = r.task+'|'+r.proj+'|'+r.ttype;
    if(!seen.has(key)){ seen.add(key); unique.push(r); }
  });

  const opts = unique.map((r,i) =>
    `<option value="${i}">${r.task} — ${r.proj} (${r.ttype})</option>`
  ).join('');

  let modal = document.getElementById('addRowModal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'addRowModal';
    modal.className = 'modal-bg';
    document.body.appendChild(modal);
    modal.addEventListener('click', e=>{ if(e.target===modal) modal.classList.remove('open'); });
  }

  modal.innerHTML = `<div class="modal" style="max-width:420px;">
    <h3>Add Row to Timesheet</h3>
    <div class="form-group" style="margin-bottom:12px;">
      <label class="form-label">Select Task</label>
      <select class="form-ctrl" id="arTaskSel">${opts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">Week (Friday start)</label>
      <input class="form-ctrl" type="date" id="arWeek" value="${iso(getFri(WO))}">
    </div>
    <div id="arErr" style="color:var(--red);font-size:.72rem;min-height:14px;margin-top:6px;"></div>
    <div class="modal-btns">
      <button class="btn btn-outline" onclick="document.getElementById('addRowModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" onclick="saveAddRow(${JSON.stringify(unique).replace(/"/g,'&quot;')})">Add Row</button>
    </div>
  </div>`;
  modal.classList.add('open');
}

function saveAddRow(unique){
  const sel  = document.getElementById('arTaskSel');
  const wkv  = document.getElementById('arWeek').value;
  const errEl= document.getElementById('arErr');
  if(!wkv){ errEl.textContent='Please select a week.'; return; }

  const src  = unique[parseInt(sel.value)];
  const wkDate = new Date(wkv+'T12:00:00');
  const normWk = iso(wkDate);

  // Check if this task already exists for this week
  const reqs = getR();
  const exists = reqs.find(r =>
    r.emp===CU.username && r.task===src.task &&
    r.proj===src.proj && normalizeFriday(r.wk)===normalizeFriday(normWk)
  );
  if(exists){ errEl.textContent='This task already exists for this week.'; return; }

  // Add as a new approved request (copy from existing)
  const newReq = {
    id: 'r'+Date.now(),
    emp: CU.username,
    empName: CU.name,
    task: src.task,
    proj: src.proj,
    ttype: src.ttype,
    wk: normalizeFriday(normWk),
    hrs: {sun:0,mon:0,tue:0,wed:0,thu:0,fri:0,sat:0},
    status: 'approved',
    approvedAt: new Date().toISOString(),
    approvedBy: 'copied from existing task',
    ca: new Date().toISOString()
  };
  reqs.push(newReq);
  persistR(reqs).then(()=>{
    document.getElementById('addRowModal').classList.remove('open');
    showToast('Row added! Enter your hours.');
    renderTS();
  }).catch(()=>{});
}


// ── EXPORT / IMPORT ───────────────────────────────────────────────
function exportData(){
  const data={requests:getR(),timesheets:getT(),exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download='timesheet_'+new Date().toISOString().split('T')[0]+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Exported! Share this file with your team.');
}
function importData(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=function(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.requests||!data.timesheets) throw new Error('Invalid file');
        setR(data.requests);setT(data.timesheets);
        showToast('Imported! '+data.requests.length+' tasks loaded.');
        if(CU&&CU.role==='admin')adminView(CV);else renderTS();
      }catch(e){showToast('Import failed: '+e.message);}
    };
    reader.readAsText(file);
  };
  document.body.appendChild(input);input.click();document.body.removeChild(input);
}
